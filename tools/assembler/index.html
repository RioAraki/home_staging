<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>家具拼装工具</title>
<style>
  :root {
    --bg:#1b1f24; --panel:#23272e; --line:#3a4049;
    --txt:#e6e9ee; --muted:#8b95a1; --accent:#ffb648;
    --sel:#57c98b; --bad:#ff5d5d; --open:rgba(87,201,139,.40);
    --hover-place:rgba(100,160,255,.30); --hover-open:rgba(87,201,139,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 system-ui,"Segoe UI",sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}

  /* top bar */
  #topbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;}
  #topbar h1{font-size:14px;margin-right:4px;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  label.lbl{color:var(--muted);font-size:12px;}
  input[type=text]{background:#171a1f;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:5px 8px;}
  input[type=number]{background:#171a1f;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:5px 6px;width:48px;}
  button{background:#2f3540;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:5px 11px;cursor:pointer;font-size:13px;}
  button:hover{background:#39414e;}
  button.primary{background:var(--accent);color:#1b1f24;border-color:var(--accent);font-weight:600;}
  button.green{background:var(--sel);color:#1b1f24;border-color:var(--sel);font-weight:600;}
  #btn-save.dirty{box-shadow:0 0 0 2px var(--accent);}
  button.active{background:var(--sel);color:#1b1f24;border-color:var(--sel);font-weight:600;}
  button.danger{color:var(--bad);}
  button:disabled{opacity:.4;cursor:default;}

  /* main */
  #main{display:flex;flex:1;overflow:hidden;}

  /* left: tile library */
  #lib{width:220px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  #lib-top{padding:7px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-shrink:0;}
  #lib-top span{color:var(--muted);font-size:12px;white-space:nowrap;}
  #lib-search{flex:1;background:#171a1f;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:4px 7px;font-size:12px;}
  #lib-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:6px;}
  .tile-thumb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px;border-radius:6px;border:2px solid transparent;cursor:pointer;background:#1e2229;}
  .tile-thumb:hover{border-color:var(--line);background:#262c35;}
  .tile-thumb.selected{border-color:var(--accent);background:#2c2718;}
  .tile-thumb img{width:68px;height:68px;object-fit:contain;image-rendering:pixelated;display:block;}
  .tile-thumb .tname{font-size:10px;color:var(--muted);text-align:center;word-break:break-all;line-height:1.2;}
  #lib-foot{padding:7px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
  #rot-display{font-size:11px;color:var(--muted);text-align:center;}
  button.mirrored{background:#3a2060;border-color:#7c4dff;color:#c9b8ff;}

  /* center: canvas */
  #stage{flex:1;position:relative;overflow:hidden;background:#15181c;}
  #cv{position:absolute;top:0;left:0;cursor:crosshair;}
  #hint{position:absolute;bottom:8px;left:10px;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:5px;color:#cfd6df;pointer-events:none;font-size:11px;}

  /* right: props + furniture list */
  #right{width:240px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  .rsec{padding:9px 12px;border-bottom:1px solid var(--line);}
  .rsec h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .kv{display:flex;justify-content:space-between;margin:3px 0;font-size:12px;}
  .kv .k{color:var(--muted);}

  /* furniture list */
  #flist-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  #flist-head{padding:8px 12px 5px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #flist-head h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  #flist-head span{font-size:11px;color:var(--muted);}
  #flist{flex:1;overflow-y:auto;}
  .fitem{padding:7px 12px;border-bottom:1px solid #2a2f37;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .fitem:hover{background:#2a3038;}
  .fitem.active{background:#2a2718;border-left:3px solid var(--accent);}
  .fitem.active{padding-left:9px;}
  .fitem .fi-name{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fitem .fi-bbox{font-size:11px;color:var(--muted);white-space:nowrap;}
  .fitem .fi-del{padding:2px 6px;font-size:11px;opacity:.6;}
  .fitem .fi-del:hover{opacity:1;color:var(--bad);}
  #flist-foot{padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-shrink:0;}
  #flist-foot button{flex:1;font-size:12px;padding:6px 8px;}

  /* tags */
  #tagsec{padding:9px 12px;border-bottom:1px solid var(--line);}
  #tagsec h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .tag-chips{display:flex;flex-wrap:wrap;gap:5px;min-height:13px;}
  .tag-zone-label{font-size:10px;color:var(--muted);margin:7px 0 4px;}
  .tag-chip.add{border-style:dashed;}
  #tag-applied:empty::after{content:"(无 · 点下方「可用标签」添加)";font-size:11px;color:var(--muted);font-style:italic;}
  .tag-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px 3px 9px;border-radius:11px;font-size:12px;
    background:#2a2f37;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none;}
  .tag-chip:hover{background:#333a44;}
  .tag-chip.on{background:#2c2718;border-color:var(--accent);color:var(--accent);font-weight:600;}
  .tag-chip .tx{padding:0 1px;}
  .tag-chip .tag-del{font-size:11px;opacity:.5;line-height:1;padding:0 1px;border-radius:8px;}
  .tag-chip .tag-del:hover{opacity:1;color:var(--bad);background:rgba(255,93,93,.15);}
  #tag-empty{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:7px;}
  #tag-add-row{display:flex;gap:5px;}
  #tag-add-input{flex:1;background:#171a1f;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:4px 7px;font-size:12px;}
  #tag-add-btn{font-size:12px;padding:4px 9px;flex-shrink:0;}
  .fi-tags{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>家具拼装</h1>
    <div class="sep"></div>
    <label class="lbl">名称</label>
    <input type="text" id="fname" placeholder="如 长沙发_opt1" style="width:140px" value="furniture_opt1" />
    <label class="lbl">W</label><input type="number" id="fw" value="4" min="1" max="20" />
    <label class="lbl">H</label><input type="number" id="fh" value="2" min="1" max="20" />
    <button id="btn-new">新建画布</button>
    <div class="sep"></div>
    <button id="btn-place" class="active">🪑 摆放</button>
    <button id="btn-open">✅ 开放格</button>
    <div class="sep"></div>
    <button id="btn-save" class="green">保存到列表</button>
    <span id="dirty-dot" title="有未保存改动,点「保存到列表」落盘" style="display:none;color:var(--accent);font-size:17px;line-height:1;margin-left:-2px">●</span>
  </div>

  <div id="main">
    <!-- left: tile library -->
    <div id="lib">
      <div id="lib-top">
        <span>碎片库</span>
        <input type="text" id="lib-search" placeholder="搜索…" />
        <button id="btn-reload-lib" title="重新加载碎片库" style="padding:3px 7px;font-size:12px;flex-shrink:0">↻</button>
      </div>
      <div id="lib-grid"></div>
      <div id="lib-foot">
        <div id="rot-display">旋转: 0° · 正常</div>
        <div style="display:flex;gap:5px">
          <button id="btn-rot" style="flex:1">旋转 (R)</button>
          <button id="btn-mirror" style="flex:1">镜像 (F)</button>
        </div>
      </div>
    </div>

    <!-- center: canvas -->
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint">左键放置 · 右键删除 · R 旋转待放碎片 · E 旋转已放碎片 · 空格拖动 · 滚轮缩放</div>
    </div>

    <!-- right -->
    <div id="right">
      <!-- current canvas info -->
      <div class="rsec">
        <h3>当前画布</h3>
        <div class="kv"><span class="k">bbox</span><span id="p-bbox">—</span></div>
        <div class="kv"><span class="k">已摆碎片</span><span id="p-placed">0</span></div>
        <div class="kv"><span class="k">开放格</span><span id="p-open">0</span></div>
      </div>
      <!-- selected cell info -->
      <div class="rsec">
        <h3>选中格</h3>
        <div id="ci-tile" style="font-size:12px;color:var(--accent);margin:2px 0">—</div>
        <div id="ci-rot" style="font-size:12px;color:var(--muted);margin:2px 0">—</div>
        <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">
          <button id="ci-rot-btn" style="flex:1;font-size:12px">旋转 (E)</button>
          <button id="ci-mirror-btn" style="flex:1;font-size:12px">镜像 (G)</button>
          <button id="ci-del" class="danger" style="flex:1 0 100%;font-size:12px;margin-top:3px">删除</button>
        </div>
      </div>
      <!-- tags -->
      <div id="tagsec">
        <h3>标签 <span id="tag-ctx" style="text-transform:none;letter-spacing:0;color:var(--accent)"></span></h3>
        <div id="tag-empty">下方输入框新建标签;点「可用标签」即可贴到当前家具</div>
        <div class="tag-zone-label">本家具标签(✕ 从本家具移除)</div>
        <div id="tag-applied" class="tag-chips"></div>
        <div class="tag-zone-label">可用标签(点一下贴到当前家具 · 双击改名 · ✕ 从词表删除)</div>
        <div id="tag-available" class="tag-chips"></div>
        <div id="tag-add-row">
          <input type="text" id="tag-add-input" placeholder="标签名(新建或套用到当前家具)" />
          <button id="tag-add-btn">+ 添加</button>
        </div>
      </div>
      <!-- furniture list -->
      <div id="flist-wrap">
        <div id="flist-head">
          <h3>家具列表</h3>
          <span id="fcount">0 件</span>
        </div>
        <div id="flist"></div>
        <div id="flist-foot">
          <button id="btn-export" class="primary">导出 JSON</button>
          <button id="btn-import">载入</button>
          <input type="file" id="importfile" accept="application/json" style="display:none" />
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const TILES_BASE = 'http://localhost:8777/asset/tiles/';
const TILES_JSON = TILES_BASE + 'tiles.json';
const LS_KEY = 'assembler-v2';
const CELL = 100;

// ── state ──────────────────────────────────────────────
let tileNames = [];
let tileImages = {};

let gridW = 4, gridH = 2;
let cells = new Map();       // "col,row" → {tile, rotation}
let openCells = new Set();   // "col,row"
let selectedTile = null;
let selectedRotation = 0;
let selectedMirror = false;
let selectedCell = null;
let mode = 'place';

// collection: array of saved furniture objects
let collection = [];
let editingIndex = -1;       // index in collection being edited (-1 = new)

// tags: global vocabulary + the current (buffer) furniture's selected tags
let tagVocab = [];           // ordered list of defined tag names
let currentTags = new Set(); // tags on the furniture currently on the canvas

let scale = 1, offX = 0, offY = 0;
let panning = false, spaceDown = false, panStart = null;
let hover = null;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

// ── init ───────────────────────────────────────────────
async function init() {
  await reloadLib();
  loadLS();
  resize();
  fit();
  render();
  updateProps();
  renderFList();
  renderTags();
}

async function reloadLib() {
  const btn = document.getElementById('btn-reload-lib');
  btn.textContent = '…'; btn.disabled = true;
  try {
    const resp = await fetch(TILES_JSON + '?t=' + Date.now()); // bust cache
    tileNames = await resp.json();
    tileImages = {}; // clear image cache so new tiles get re-fetched
    renderLib();
  } catch(e) {
    alert('无法加载 tiles.json，请确认 http-server 正在运行且 crop.py 已执行');
  } finally {
    btn.textContent = '↻'; btn.disabled = false;
  }
}

document.getElementById('btn-reload-lib').onclick = reloadLib;

// ── tile library ───────────────────────────────────────
let libFilter = '';
document.getElementById('lib-search').oninput = e => {
  libFilter = e.target.value.toLowerCase(); renderLib();
};
function renderLib() {
  const grid = document.getElementById('lib-grid');
  grid.innerHTML = '';
  tileNames.filter(n => n.toLowerCase().includes(libFilter)).forEach(name => {
    const div = document.createElement('div');
    div.className = 'tile-thumb' + (name === selectedTile ? ' selected' : '');
    div.innerHTML = `<img src="${TILES_BASE}${name}.png" loading="lazy"/><div class="tname">${name}</div>`;
    div.onclick = () => { selectedTile = name; renderLib(); };
    grid.appendChild(div);
  });
}
function loadTileImage(name) {
  if (tileImages[name]?.complete && tileImages[name].naturalWidth) return tileImages[name];
  if (!tileImages[name]) {
    const img = new Image();
    img.onload = () => { tileImages[name] = img; render(); };
    img.src = `${TILES_BASE}${name}.png`;
    tileImages[name] = img;
  }
  return tileImages[name];
}

// ── rotation / mirror (pending tile) ──────────────────
document.getElementById('btn-rot').onclick = rotatePending;
document.getElementById('btn-mirror').onclick = mirrorPending;

function rotatePending() {
  selectedRotation = (selectedRotation + 90) % 360;
  updatePendingDisplay();
}
function mirrorPending() {
  selectedMirror = !selectedMirror;
  updatePendingDisplay();
}
function updatePendingDisplay() {
  document.getElementById('rot-display').textContent =
    `旋转: ${selectedRotation}° · ${selectedMirror ? '镜像' : '正常'}`;
  document.getElementById('btn-mirror').className =
    'button' + (selectedMirror ? ' mirrored' : '');
}

// ── mode ───────────────────────────────────────────────
document.getElementById('btn-place').onclick = () => setMode('place');
document.getElementById('btn-open').onclick  = () => setMode('open');
function setMode(m) {
  mode = m;
  document.getElementById('btn-place').className = 'button' + (m === 'place' ? ' active' : '');
  document.getElementById('btn-open').className  = 'button' + (m === 'open'  ? ' active' : '');
  ['btn-place','btn-open'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('active', (id === 'btn-place') === (m === 'place'));
  });
}

// ── new canvas ─────────────────────────────────────────
document.getElementById('btn-new').onclick = () => {
  const w = parseInt(document.getElementById('fw').value) || 4;
  const h = parseInt(document.getElementById('fh').value) || 2;
  // auto-save current canvas if it has content
  if (cells.size > 0 || openCells.size > 0) {
    const name = document.getElementById('fname').value.trim();
    if (!name) { alert('请先给当前家具起个名字，再新建画布'); return; }
    const obj = buildFurnitureObj(name);
    if (editingIndex >= 0) {
      collection[editingIndex] = obj;
    } else {
      const dup = collection.findIndex(f => f.name === name);
      if (dup >= 0) collection[dup] = obj;
      else { collection.push(obj); editingIndex = collection.length - 1; }
    }
    renderFList();
  }
  gridW = w; gridH = h;
  cells.clear(); openCells.clear(); selectedCell = null;
  editingIndex = -1; currentTags.clear();
  document.getElementById('fname').value = '';
  fit(); updateProps(); updateCellInfo(null); render(); renderTags(); markDirty();
};

// ── save to collection ────────────────────────────────
document.getElementById('btn-save').onclick = () => {
  const name = document.getElementById('fname').value.trim();
  if (!name) { alert('请先输入家具名称'); return; }
  const obj = buildFurnitureObj(name);
  if (editingIndex >= 0) {
    collection[editingIndex] = obj;
  } else {
    // check duplicate name
    const dup = collection.findIndex(f => f.name === name);
    if (dup >= 0) {
      if (!confirm(`列表中已有「${name}」，覆盖？`)) return;
      collection[dup] = obj;
      editingIndex = dup;
    } else {
      collection.push(obj);
      editingIndex = collection.length - 1;
    }
  }
  renderFList();
  persist();   // 「保存到列表」= 落盘:写入 localStorage 并清除未保存标记
};

function buildFurnitureObj(name) {
  const tilesArr = [...cells].map(([k, v]) => {
    const [c, r] = k.split(',').map(Number);
    const obj = { tile: v.tile, col: c, row: r, rotation: v.rotation };
    if (v.mirror) obj.mirror = true;
    return obj;
  }).sort((a, b) => a.row - b.row || a.col - b.col);
  const openArr = [...openCells].map(k => {
    const [c, r] = k.split(',').map(Number); return [r, c]; // [row,col]
  }).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const obj = { name, bbox: [gridH, gridW], tiles: tilesArr, open_cells: openArr };
  if (currentTags.size) obj.tags = [...currentTags];
  return obj;
}

// ── furniture list ─────────────────────────────────────
function renderFList() {
  document.getElementById('fcount').textContent = `${collection.length} 件`;
  const list = document.getElementById('flist');
  list.innerHTML = '';
  collection.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'fitem' + (i === editingIndex ? ' active' : '');
    const tagsLine = (f.tags && f.tags.length)
      ? `<div class="fi-tags" title="${f.tags.join(' · ')}">🏷 ${f.tags.join(' · ')}</div>` : '';
    div.innerHTML = `
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="fi-name" title="${f.name}">${f.name}</span>
          <span class="fi-bbox">${f.bbox[1]}×${f.bbox[0]}</span>
        </div>
        ${tagsLine}
      </div>
      <button class="fi-del" title="删除">✕</button>`;
    div.querySelector('.fi-del').onclick = e => {
      e.stopPropagation();
      if (!confirm(`删除「${f.name}」？`)) return;
      if (editingIndex === i) {
        cells.clear(); openCells.clear(); selectedCell = null;
        editingIndex = -1; updateProps(); updateCellInfo(null); render();
      } else if (editingIndex > i) editingIndex--;
      collection.splice(i, 1);
      renderFList(); markDirty();
    };
    div.onclick = () => loadFurniture(i);
    list.appendChild(div);
  });
}

function loadFurniture(i) {
  commitBuffer();   // 先把当前家具的未保存改动折回内存,切换不丢失
  const f = collection[i];
  document.getElementById('fname').value = f.name;
  document.getElementById('fw').value = f.bbox[1];
  document.getElementById('fh').value = f.bbox[0];
  gridW = f.bbox[1]; gridH = f.bbox[0];
  cells.clear();
  (f.tiles || []).forEach(t => cells.set(t.col + ',' + t.row, { tile: t.tile, rotation: t.rotation || 0, mirror: !!t.mirror }));
  openCells.clear();
  (f.open_cells || []).forEach(([r, c]) => openCells.add(c + ',' + r));
  currentTags = new Set(f.tags || []);
  selectedCell = null; editingIndex = i;
  fit(); updateProps(); updateCellInfo(null); render(); renderFList(); renderTags();
}

// ── tags ───────────────────────────────────────────────
function renderTags() {
  const nm = document.getElementById('fname').value.trim();
  document.getElementById('tag-ctx').textContent = nm ? `→ ${nm}` : '→ (未命名)';
  document.getElementById('tag-empty').style.display = tagVocab.length ? 'none' : 'block';
  const applied = document.getElementById('tag-applied');
  const avail = document.getElementById('tag-available');
  applied.innerHTML = ''; avail.innerHTML = '';
  // 上区 = 已贴到当前家具的标签(✕ 仅从本家具移除);
  // 下区 = 词表里其余可用标签(点一下贴到本家具;✕ 从词表彻底删除)。
  // 只有出现在上区(高亮)才代表当前家具拥有该标签。
  tagVocab.forEach(tag => {
    const on = currentTags.has(tag);
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (on ? ' on' : ' add');
    const tx = document.createElement('span');
    tx.className = 'tx';
    tx.textContent = on ? tag : ('＋ ' + tag);
    tx.ondblclick = () => renameTag(tag);
    const del = document.createElement('span');
    del.className = 'tag-del'; del.textContent = '✕';
    if (on) {
      chip.title = '已贴到当前家具';
      del.title = '从当前家具移除'; del.onclick = e => { e.stopPropagation(); toggleTag(tag); };
      chip.appendChild(tx); chip.appendChild(del);
      applied.appendChild(chip);
    } else {
      chip.title = '点一下贴到当前家具 · 双击改名';
      tx.onclick = () => toggleTag(tag);
      del.title = '从词表彻底删除'; del.onclick = e => { e.stopPropagation(); deleteTag(tag); };
      chip.appendChild(tx); chip.appendChild(del);
      avail.appendChild(chip);
    }
  });
}
function addTag(name) {
  name = (name || '').trim();
  if (!name) return;
  // 标签是用来把多件家具归到一组的:新标签加进词表,无论新旧都套用到当前家具。
  // (之前对已存在标签直接报错,导致"不同家具不能共用同一标签"的错觉。)
  if (!tagVocab.includes(name)) tagVocab.push(name);
  currentTags.add(name);
  renderTags(); markDirty();
}
function toggleTag(tag) {
  if (currentTags.has(tag)) currentTags.delete(tag); else currentTags.add(tag);
  renderTags(); markDirty();
}
function renameTag(oldName) {
  const next = prompt(`重命名标签「${oldName}」为:`, oldName);
  if (next == null) return;
  const nm = next.trim();
  if (!nm || nm === oldName) return;
  if (tagVocab.includes(nm)) { alert(`标签「${nm}」已存在`); return; }
  tagVocab = tagVocab.map(t => t === oldName ? nm : t);
  collection.forEach(f => { if (f.tags) f.tags = f.tags.map(t => t === oldName ? nm : t); });
  if (currentTags.delete(oldName)) currentTags.add(nm);
  renderTags(); renderFList(); markDirty();
}
function deleteTag(tag) {
  if (!confirm(`从词表删除标签「${tag}」？所有家具上的该标签也会移除。`)) return;
  tagVocab = tagVocab.filter(t => t !== tag);
  collection.forEach(f => { if (f.tags) f.tags = f.tags.filter(t => t !== tag); });
  currentTags.delete(tag);
  renderTags(); renderFList(); markDirty();
}
document.getElementById('tag-add-btn').onclick = () => {
  const inp = document.getElementById('tag-add-input');
  addTag(inp.value); inp.value = ''; inp.focus();
};
document.getElementById('tag-add-input').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { addTag(ev.target.value); ev.target.value = ''; ev.preventDefault(); }
});
document.getElementById('fname').addEventListener('input', () => {
  const nm = document.getElementById('fname').value.trim();
  document.getElementById('tag-ctx').textContent = nm ? `→ ${nm}` : '→ (未命名)';
});

// ── export / import ────────────────────────────────────
document.getElementById('btn-export').onclick = () => {
  commitBuffer();   // 把当前家具的未保存改动折回内存,确保导出包含最新编辑
  if (collection.length === 0) { alert('列表为空，请先保存至少一件家具'); return; }
  const data = { tag_vocabulary: tagVocab, furniture: collection };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'furniture_collection.json';
  a.click();
};

document.getElementById('btn-import').onclick = () => document.getElementById('importfile').click();
document.getElementById('importfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      const list = d.furniture || (Array.isArray(d) ? d : null);
      if (!list) { alert('格式不对，需要 { "furniture": [...] }'); return; }
      if (collection.length > 0 && !confirm(`载入会替换当前 ${collection.length} 件家具，继续？`)) return;
      collection = list;
      if (Array.isArray(d.tag_vocabulary)) tagVocab = d.tag_vocabulary.slice();
      editingIndex = -1; cells.clear(); openCells.clear(); selectedCell = null; currentTags.clear();
      renderFList(); updateProps(); updateCellInfo(null); render(); renderTags(); persist();
    } catch (err) { alert('解析失败: ' + err); }
  };
  rd.readAsText(f);
  e.target.value = '';
};

// ── canvas / view ──────────────────────────────────────
function resize() { cv.width = stage.clientWidth; cv.height = stage.clientHeight; render(); }
window.addEventListener('resize', resize);

function fit() {
  const s = Math.min(cv.width / (gridW * CELL), cv.height / (gridH * CELL)) * 0.88;
  scale = Math.max(0.1, s);
  offX = (cv.width - gridW * CELL * scale) / 2;
  offY = (cv.height - gridH * CELL * scale) / 2;
}
const w2sX = wx => wx * scale + offX;
const w2sY = wy => wy * scale + offY;
const s2wX = sx => (sx - offX) / scale;
const s2wY = sy => (sy - offY) / scale;

// ── render ─────────────────────────────────────────────
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const x0 = w2sX(0), y0 = w2sY(0), cw = gridW * CELL * scale, ch = gridH * CELL * scale;

  ctx.fillStyle = '#1e2229'; ctx.fillRect(x0, y0, cw, ch);

  // void cells (no tile, no open cell) — diagonal stripe pattern
  const sz = CELL * scale;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      const key = c + ',' + r;
      if (!cells.has(key) && !openCells.has(key)) {
        const cx = w2sX(c * CELL), cy = w2sY(r * CELL);
        ctx.save();
        ctx.beginPath(); ctx.rect(cx, cy, sz, sz); ctx.clip();
        ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
        const step = Math.max(8, sz / 8);
        for (let i = -sz; i < sz * 2; i += step) {
          ctx.beginPath(); ctx.moveTo(cx + i, cy); ctx.lineTo(cx + i + sz, cy + sz); ctx.stroke();
        }
        ctx.restore();
      }
    }
  }

  // tiles
  for (const [key, { tile, rotation, mirror }] of cells) {
    const [c, r] = key.split(',').map(Number);
    drawTile(tile, c, r, rotation, mirror);
  }
  // open cells
  ctx.fillStyle = 'rgba(87,201,139,.38)';
  for (const key of openCells) {
    const [c, r] = key.split(',').map(Number);
    ctx.fillRect(w2sX(c * CELL), w2sY(r * CELL), CELL * scale, CELL * scale);
  }
  // grid
  ctx.strokeStyle = 'rgba(160,180,220,.22)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let c = 0; c <= gridW; c++) { const x = Math.round(w2sX(c * CELL)) + .5; ctx.moveTo(x, y0); ctx.lineTo(x, y0 + ch); }
  for (let r = 0; r <= gridH; r++) { const y = Math.round(w2sY(r * CELL)) + .5; ctx.moveTo(x0, y); ctx.lineTo(x0 + cw, y); }
  ctx.stroke();
  // hover
  if (hover) {
    ctx.fillStyle = mode === 'open' ? 'rgba(87,201,139,.22)' : 'rgba(100,160,255,.22)';
    ctx.fillRect(w2sX(hover.col * CELL), w2sY(hover.row * CELL), CELL * scale, CELL * scale);
    ctx.strokeStyle = mode === 'open' ? '#57c98b' : '#7fd0ff'; ctx.lineWidth = 2;
    ctx.strokeRect(w2sX(hover.col * CELL), w2sY(hover.row * CELL), CELL * scale, CELL * scale);
  }
  // selected cell
  if (selectedCell) {
    const [c, r] = selectedCell.split(',').map(Number);
    ctx.strokeStyle = '#ffb648'; ctx.lineWidth = 3;
    ctx.strokeRect(w2sX(c * CELL) + 1, w2sY(r * CELL) + 1, CELL * scale - 2, CELL * scale - 2);
  }
  // border
  ctx.strokeStyle = '#3a4049'; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, cw, ch);
}

function drawTile(name, col, row, rotation, mirror) {
  const img = loadTileImage(name);
  if (!img?.complete || !img.naturalWidth) return;
  const cx = w2sX(col * CELL + CELL / 2), cy = w2sY(row * CELL + CELL / 2), sz = CELL * scale;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation * Math.PI / 180);
  if (mirror) ctx.scale(-1, 1);
  ctx.drawImage(img, -sz / 2, -sz / 2, sz, sz);
  ctx.restore();
}

// ── mouse ──────────────────────────────────────────────
function cellAt(ev) {
  const rect = cv.getBoundingClientRect();
  const c = Math.floor(s2wX(ev.clientX - rect.left) / CELL);
  const r = Math.floor(s2wY(ev.clientY - rect.top) / CELL);
  if (c < 0 || r < 0 || c >= gridW || r >= gridH) return null;
  return { col: c, row: r };
}

cv.addEventListener('mousemove', ev => {
  if (panning) { offX = panStart.ox + (ev.clientX - panStart.x); offY = panStart.oy + (ev.clientY - panStart.y); render(); return; }
  const h = cellAt(ev);
  const same = h && hover && h.col === hover.col && h.row === hover.row;
  if (!same) { hover = h; render(); }
});
cv.addEventListener('mouseleave', () => { hover = null; render(); });
cv.addEventListener('mousedown', ev => {
  if (ev.button === 1 || spaceDown) { panning = true; panStart = { x: ev.clientX, y: ev.clientY, ox: offX, oy: offY }; cv.style.cursor = 'grabbing'; ev.preventDefault(); return; }
  if (ev.button !== 0) return;
  const cell = cellAt(ev); if (!cell) return;
  const key = cell.col + ',' + cell.row;
  if (mode === 'open') {
    if (openCells.has(key)) openCells.delete(key); else openCells.add(key);
    updateProps(); render(); markDirty(); return;
  }
  if (cells.has(key)) { selectedCell = key; updateCellInfo(key); }
  else if (selectedTile) { cells.set(key, { tile: selectedTile, rotation: selectedRotation, mirror: selectedMirror }); selectedCell = key; updateCellInfo(key); updateProps(); markDirty(); }
  render();
});
cv.addEventListener('contextmenu', ev => {
  ev.preventDefault(); if (panning) return;
  const cell = cellAt(ev); if (!cell) return;
  const key = cell.col + ',' + cell.row;
  if (cells.has(key)) { cells.delete(key); if (selectedCell === key) { selectedCell = null; updateCellInfo(null); } updateProps(); markDirty(); render(); }
});
window.addEventListener('mouseup', () => { panning = false; cv.style.cursor = spaceDown ? 'grab' : 'crosshair'; });
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const rect = cv.getBoundingClientRect(), mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const wx = s2wX(mx), wy = s2wY(my), f = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  scale = Math.max(0.1, Math.min(20, scale * f)); offX = mx - wx * scale; offY = my - wy * scale; render();
}, { passive: false });

// ── keyboard ───────────────────────────────────────────
window.addEventListener('keydown', ev => {
  if (document.activeElement?.tagName === 'INPUT') return;
  if (ev.code === 'Space') { spaceDown = true; cv.style.cursor = 'grab'; ev.preventDefault(); }
  if (ev.key === 'r' || ev.key === 'R') rotatePending();
  if (ev.key === 'e' || ev.key === 'E') rotatePlaced();
  if (ev.key === 'g' || ev.key === 'G') mirrorPlaced();
  if (ev.key === 'f' || ev.key === 'F') mirrorPending();
  if (ev.key === 'Delete' || ev.key === 'Backspace') deletePlaced();
});
window.addEventListener('keyup', ev => { if (ev.code === 'Space') { spaceDown = false; if (!panning) cv.style.cursor = 'crosshair'; } });

function rotatePlaced() {
  if (!selectedCell || !cells.has(selectedCell)) return;
  cells.get(selectedCell).rotation = (cells.get(selectedCell).rotation + 90) % 360;
  updateCellInfo(selectedCell); markDirty(); render();
}
function mirrorPlaced() {
  if (!selectedCell || !cells.has(selectedCell)) return;
  const c = cells.get(selectedCell);
  c.mirror = !c.mirror;
  updateCellInfo(selectedCell); markDirty(); render();
}
function deletePlaced() {
  if (!selectedCell) return;
  cells.delete(selectedCell); selectedCell = null; updateCellInfo(null); updateProps(); markDirty(); render();
}

document.getElementById('ci-rot-btn').onclick = rotatePlaced;
document.getElementById('ci-mirror-btn').onclick = mirrorPlaced;
document.getElementById('ci-del').onclick = deletePlaced;

// ── cell info ──────────────────────────────────────────
function updateCellInfo(key) {
  if (!key || !cells.has(key)) {
    document.getElementById('ci-tile').textContent = '—';
    document.getElementById('ci-rot').textContent = '—';
    document.getElementById('ci-mirror-btn').className = 'button';
    return;
  }
  const { tile, rotation, mirror } = cells.get(key);
  document.getElementById('ci-tile').textContent = tile;
  document.getElementById('ci-rot').textContent = `旋转: ${rotation}° · ${mirror ? '镜像' : '正常'}`;
  document.getElementById('ci-mirror-btn').className = 'button' + (mirror ? ' mirrored' : '');
}

function updateProps() {
  document.getElementById('p-bbox').textContent = `${gridW}×${gridH}`;
  document.getElementById('p-placed').textContent = cells.size;
  document.getElementById('p-open').textContent = openCells.size;
}

// ── 持久化(以保存为准) ─────────────────────────────────
// localStorage 只在「保存到列表」按钮 / 导入时写入(= 上次落盘的快照)。
// 其余改动只标脏(markDirty),停留在内存;切换家具用 commitBuffer 折回内存
// collection 不落盘 —— 于是:切换家具保留改动,刷新但没保存则丢弃未保存改动。
let dirty = false;
function markDirty() {
  dirty = true;
  document.getElementById('dirty-dot').style.display = '';
}
function persist() {
  dirty = false;
  document.getElementById('dirty-dot').style.display = 'none';
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      gridW, gridH, editingIndex,
      fname: document.getElementById('fname').value,
      cells: [...cells], openCells: [...openCells],
      collection, tagVocab, currentTags: [...currentTags],
    }));
  } catch(e) {}
}
// 把当前画布缓冲(含 tags)折回内存 collection,但不落盘 —— 切换家具前调用,
// 保证未保存的改动不会因切换而丢失。
function commitBuffer() {
  if (cells.size === 0 && openCells.size === 0) return;
  const name = document.getElementById('fname').value.trim();
  if (editingIndex >= 0) {
    collection[editingIndex] = buildFurnitureObj(name || collection[editingIndex].name);
  } else if (name) {
    const dup = collection.findIndex(f => f.name === name);
    if (dup >= 0) collection[dup] = buildFurnitureObj(name);
    else { collection.push(buildFurnitureObj(name)); editingIndex = collection.length - 1; }
  }
}
function loadLS() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return;
    const d = JSON.parse(raw);
    if (d.gridW) { gridW = d.gridW; document.getElementById('fw').value = gridW; }
    if (d.gridH) { gridH = d.gridH; document.getElementById('fh').value = gridH; }
    if (d.fname) document.getElementById('fname').value = d.fname;
    cells = new Map((d.cells || []).map(([k, v]) => [k, { ...v, mirror: !!v.mirror }]));
    openCells = new Set(d.openCells || []);
    collection = d.collection || [];
    editingIndex = d.editingIndex ?? -1;
    tagVocab = d.tagVocab || [];
    currentTags = new Set(d.currentTags || []);
  } catch(e) {}
}

init();

// auto-refresh tile library when annotator finishes a crop
const cropChannel = new BroadcastChannel('tiles-updated');
cropChannel.onmessage = async () => {
  await reloadLib();
  // brief flash on the refresh button to signal auto-update
  const btn = document.getElementById('btn-reload-lib');
  btn.textContent = '✓'; btn.style.color = 'var(--sel)';
  setTimeout(() => { btn.textContent = '↻'; btn.style.color = ''; }, 1500);
};
})();
</script>
</body>
