<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>关卡编辑器</title>
<style>
  :root{--bg:#1b1f24;--panel:#23272e;--line:#3a4049;--txt:#e6e9ee;--muted:#8b95a1;--accent:#ffb648;--bad:#ff5d5d;--good:#57c98b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 system-ui,"Segoe UI",sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}
  #topbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0;}
  #topbar h1{font-size:14px;margin-right:4px;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  label.lbl{color:var(--muted);font-size:12px;}
  input[type=text],input[type=number],select,textarea{background:#171a1f;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:5px 8px;font:inherit;}
  input[type=number]{width:56px;}
  textarea{width:100%;resize:vertical;min-height:42px;font-size:11px;}
  button{background:#2f3540;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:13px;}
  button:hover{background:#39414e;}
  button.primary{background:var(--accent);color:#1b1f24;border-color:var(--accent);font-weight:600;}
  button.active{background:var(--good);color:#1b1f24;border-color:var(--good);font-weight:600;}
  button.danger{color:var(--bad);}
  #main{display:flex;flex:1;overflow:hidden;}
  #left{width:178px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
  #right{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
  .sec{padding:8px 10px;border-bottom:1px solid var(--line);}
  .sec h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .row{display:flex;gap:5px;align-items:center;margin:4px 0;}
  .row label.k{color:var(--muted);width:62px;flex:none;font-size:12px;}
  .row input[type=text],.row select{flex:1;min-width:0;}
  .toolbtn{display:block;width:100%;text-align:left;margin:3px 0;}
  #stage{flex:1;position:relative;overflow:hidden;background:#15181c;}
  #cv{position:absolute;inset:0;cursor:crosshair;}
  #hint{position:absolute;bottom:8px;left:10px;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:5px;color:#cfd6df;pointer-events:none;font-size:11px;}
  .listitem{border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0;background:#1e2229;}
  .listitem .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .listitem .hd b{font-size:12px;}
  .mini{font-size:11px;color:var(--muted);}
  #issues div{padding:3px 0;border-bottom:1px solid #2a2f37;font-size:12px;color:var(--bad);}
  #issues .none{color:var(--good);}
  #status{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>关卡编辑器</h1>
    <label class="lbl">载入</label>
    <select id="scenpick" style="max-width:200px"></select>
    <button id="btn-reloadlist" title="刷新列表">↻</button>
    <div class="sep"></div>
    <button id="btn-new">新建</button>
    <button id="btn-save" class="primary">保存到 md/scenarios/ + 重建</button>
    <span id="status"></span>
  </div>
  <div id="main">
    <!-- left: tools -->
    <div id="left">
      <div class="sec">
        <h3>画布</h3>
        <div class="row"><label class="k">行×列</label>
          <input type="number" id="grows" value="16" min="1" max="16" />
          <input type="number" id="gcols" value="16" min="1" max="16" />
        </div>
        <button id="btn-resize" class="toolbtn">应用尺寸</button>
      </div>
      <div class="sec">
        <h3>地形刷</h3>
        <div id="terrain-tools"></div>
      </div>
      <div class="sec">
        <h3>特征刷</h3>
        <div class="row"><select id="feature-sel"></select></div>
        <button id="tool-feature" class="toolbtn">特征刷子</button>
      </div>
      <div class="sec">
        <h3>预绘元素</h3>
        <button id="tool-door" class="toolbtn">门(点格子边)</button>
        <button id="tool-window" class="toolbtn">窗(点格子边)</button>
        <button id="tool-wall" class="toolbtn">内墙(点格子边)</button>
        <button id="tool-marker" class="toolbtn">Marker(点格子)</button>
        <button id="tool-frontcell" class="toolbtn">前门强制格</button>
      </div>
    </div>
    <!-- center -->
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint">左键画/放 · 右键擦 · 空格或中键拖动 · 滚轮缩放</div>
    </div>
    <!-- right: data panels -->
    <div id="right">
      <div class="sec">
        <h3>元信息</h3>
        <div class="row"><label class="k">id</label><input type="text" id="m-id" placeholder="my_level (slug)" /></div>
        <div class="row"><label class="k">中文名</label><input type="text" id="m-tzh" /></div>
        <div class="row"><label class="k">英文名</label><input type="text" id="m-ten" /></div>
        <div class="row"><label class="k">章节</label><input type="text" id="m-ch" /></div>
        <div class="row"><label class="k">难度</label>
          <select id="m-diff"><option>training</option><option>easy</option><option>medium</option><option>hard</option></select>
        </div>
        <div class="row"><label class="k">书页</label><input type="text" id="m-pages" placeholder="逗号分隔，如 12,13" /></div>
        <div class="row"><label class="k">页图</label><input type="text" id="m-img" /></div>
      </div>
      <div class="sec">
        <h3>规则</h3>
        <div class="row"><label class="k">走廊必需</label><input type="checkbox" id="r-hall" /></div>
        <div class="row"><label class="k">前门</label>
          <select id="r-fd"><option value="anywhere">任意外墙</option><option value="forced_edges">限定边</option><option value="forced_cells">限定格</option></select>
        </div>
        <div class="row"><label class="k">前门宽</label><input type="number" id="r-fdw" value="1" min="1" max="3" /></div>
        <div class="mini" id="r-fd-info"></div>
      </div>
      <div class="sec">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">房间</h3><button id="btn-addroom">+ 房间</button></div>
        <div id="rooms"></div>
      </div>
      <div class="sec">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">奖励目标</h3><button id="btn-addbonus">+ 奖励</button></div>
        <div id="bonuses"></div>
      </div>
      <div class="sec">
        <h3>校验</h3>
        <div id="issues"></div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import * as M from './model.js';

const $ = (id) => document.getElementById(id);
const LS_KEY = 'level-editor-v1';
const TERRAIN_COLOR = { indoor:'#2d3a4a', outdoor:'#15181c', water:'#1f3a4d', obstacle:'#3a2222', road:'#333a33' };

let model = M.emptyModel(16, 16);
let library = [];            // unified named furniture: full entries + {source}
let libByName = new Map();   // name -> entry
let validNames = new Set();  // valid furniture names
const TILE_BASE = '/asset/tiles/';
const CARD_BASE = '/md/';
let tool = 'terrain';        // terrain|feature|door|window|wall|marker|frontcell
let terrainValue = 'indoor';

// view transform
let scale = 1, offX = 0, offY = 0, panning = false, spaceDown = false, panStart = null;
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const BASECELL = 40;

// ── boot ────────────────────────────────────────────────
async function boot() {
  buildTerrainTools();
  buildFeatureOptions();
  wireTools(); wireMeta(); wireButtons();
  await loadLibrary();
  await reloadScenarioList();
  const saved = localStorage.getItem(LS_KEY);
  if (saved) { try { model = JSON.parse(saved); } catch(e){} }
  refreshAll(); resize(); fit(); render();
}

async function loadLibrary() {
  library = [];
  const add = (arr, source) => { for (const f of (arr || [])) if (f && f.name) library.push({ ...f, source }); };
  try { const r = await fetch('/asset/furniture_collection.json?t=' + Date.now()); const d = await r.json(); add(d.furniture || d, 'custom'); } catch(e) { console.warn('collection load failed', e); }
  try { const r = await fetch('/asset/cards_furniture.json?t=' + Date.now()); const d = await r.json(); add(d.furniture || d, 'card'); } catch(e) { console.warn('cards_furniture load failed', e); }
  const seen = new Set();
  library = library.filter(f => { if (seen.has(f.name)) return false; seen.add(f.name); return true; });
  libByName = new Map(library.map(f => [f.name, f]));
  validNames = new Set(library.map(f => f.name));
}

// Build a thumbnail element for a furniture name.
//  - card  → the original card photo (shows the diagram)
//  - custom → composite its tiles onto a small canvas
function furnitureThumb(name, px) {
  const e = libByName.get(name);
  if (!e) { const s = document.createElement('span'); s.textContent = '?'; return s; }
  if (e.source === 'card' && e.image) {
    const img = document.createElement('img');
    img.src = CARD_BASE + e.image; img.loading = 'lazy';
    img.style.height = px + 'px'; img.style.width = 'auto'; img.style.maxWidth = (px * 1.6) + 'px';
    img.style.objectFit = 'contain'; img.style.background = '#fff'; img.style.borderRadius = '3px';
    return img;
  }
  // custom: composite tiles
  const rows = e.bbox?.[0] || 1, cols = e.bbox?.[1] || 1;
  const cell = Math.max(6, Math.floor(px / Math.max(rows, cols)));
  const cvs = document.createElement('canvas'); cvs.width = cols * cell; cvs.height = rows * cell;
  cvs.style.background = '#1e2229'; cvs.style.borderRadius = '3px';
  const cx = cvs.getContext('2d');
  cx.fillStyle = 'rgba(87,201,139,.28)';
  for (const [r, c] of (e.open_cells || [])) cx.fillRect(c * cell, r * cell, cell, cell);
  for (const t of (e.tiles || [])) {
    const img = new Image();
    img.onload = () => { cx.save(); cx.translate(t.col * cell + cell / 2, t.row * cell + cell / 2); cx.rotate((t.rotation || 0) * Math.PI / 180); if (t.mirror) cx.scale(-1, 1); cx.drawImage(img, -cell / 2, -cell / 2, cell, cell); cx.restore(); };
    img.src = TILE_BASE + t.tile + '.png';
  }
  return cvs;
}

async function reloadScenarioList() {
  const sel = $('scenpick');
  sel.innerHTML = '<option value="">— 选择关卡载入 —</option>';
  try {
    const r = await fetch('/api/scenarios');
    const d = await r.json();
    for (const s of (d.scenarios || [])) {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = `${s.title_zh || s.id} (${s.difficulty})`;
      sel.appendChild(o);
    }
  } catch(e) { setStatus('列表加载失败：服务器没开?', true); }
}

// ── tools UI ────────────────────────────────────────────
function buildTerrainTools() {
  const box = $('terrain-tools'); box.innerHTML = '';
  for (const t of M.TERRAINS) {
    const b = document.createElement('button');
    b.className = 'toolbtn'; b.dataset.terrain = t; b.textContent = t;
    b.onclick = () => { tool = 'terrain'; terrainValue = t; syncToolButtons(); };
    box.appendChild(b);
  }
}
function buildFeatureOptions() {
  const sel = $('feature-sel'); sel.innerHTML = '<option value="">(清除特征)</option>';
  for (const f of M.FEATURES) { const o = document.createElement('option'); o.value = f; o.textContent = f; sel.appendChild(o); }
}
function wireTools() {
  $('tool-feature').onclick = () => { tool = 'feature'; syncToolButtons(); };
  $('tool-door').onclick = () => { tool = 'door'; syncToolButtons(); };
  $('tool-window').onclick = () => { tool = 'window'; syncToolButtons(); };
  $('tool-wall').onclick = () => { tool = 'wall'; syncToolButtons(); };
  $('tool-marker').onclick = () => { tool = 'marker'; syncToolButtons(); };
  $('tool-frontcell').onclick = () => { tool = 'frontcell'; syncToolButtons(); };
}
function syncToolButtons() {
  document.querySelectorAll('#left button.toolbtn').forEach(b => b.classList.remove('active'));
  if (tool === 'terrain') document.querySelector(`#terrain-tools button[data-terrain="${terrainValue}"]`)?.classList.add('active');
  else $('tool-' + tool)?.classList.add('active');
}

// ── meta / rules binding ────────────────────────────────
function wireMeta() {
  const bind = (id, fn) => { $(id).addEventListener('input', () => { fn($(id).value); persist(); refreshValidation(); }); };
  bind('m-id', v => model.meta.id = v.trim());
  bind('m-tzh', v => model.meta.title_zh = v);
  bind('m-ten', v => model.meta.title_en = v);
  bind('m-ch', v => model.meta.chapter_zh = v);
  bind('m-img', v => model.meta.page_image = v);
  $('m-diff').addEventListener('change', () => { model.meta.difficulty = $('m-diff').value; persist(); });
  $('m-pages').addEventListener('input', () => { model.meta.pages_in_book = $('m-pages').value.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n)); persist(); });
  $('r-hall').addEventListener('change', () => { model.rules.hallway_required = $('r-hall').checked; persist(); });
  $('r-fd').addEventListener('change', () => { model.rules.front_door.mode = $('r-fd').value; persist(); render(); refreshFdInfo(); });
  $('r-fdw').addEventListener('input', () => { model.rules.front_door.width = parseInt($('r-fdw').value,10)||1; persist(); });
}
function refreshFdInfo() {
  const fd = model.rules.front_door;
  let s = '';
  if (fd.mode === 'forced_cells') s = `强制格 ${fd.forced_cells.length} 个(用「前门强制格」工具点选)`;
  else if (fd.mode === 'forced_edges') s = `限定边 ${fd.forced_edges.length} 条(暂只支持读取)`;
  $('r-fd-info').textContent = s;
}

function wireButtons() {
  $('btn-reloadlist').onclick = reloadScenarioList;
  $('btn-resize').onclick = () => {
    const r = Math.max(1, Math.min(16, parseInt($('grows').value,10)||16));
    const c = Math.max(1, Math.min(16, parseInt($('gcols').value,10)||16));
    resizeModel(r, c); persist(); fit(); render(); refreshValidation();
  };
  $('btn-new').onclick = () => { if (!confirm('新建空白关卡？当前未保存的会丢失')) return; model = M.emptyModel(16,16); $('scenpick').value=''; refreshAll(); fit(); render(); };
  $('btn-addroom').onclick = () => {
    const used = new Set(model.rooms.map(r=>r.slot));
    const slot = ['I','II','III','IV','V'].find(s=>!used.has(s)) || 'I';
    model.rooms.push({ slot, name_zh:'', name_en:'', furniture_numbers:[] }); persist(); renderRooms(); refreshValidation();
  };
  $('btn-addbonus').onclick = () => { model.bonus_points.push({ text_zh:'', text_en:'', points:1, condition:undefined }); persist(); renderBonuses(); };
  $('scenpick').onchange = async () => {
    const id = $('scenpick').value; if (!id) return;
    try {
      const r = await fetch(`/md/scenarios/${id}.json?t=` + Date.now());
      const json = await r.json();
      model = M.parseScenario(json);
      refreshAll(); fit(); render(); setStatus(`已载入 ${id}`);
    } catch(e) { setStatus('载入失败：' + e.message, true); }
  };
  $('btn-save').onclick = saveScenario;
}

async function saveScenario() {
  const issues = M.validate(model, validNames);
  if (issues.length && !confirm(`有 ${issues.length} 条校验问题，仍然保存？\n\n` + issues.join('\n'))) return;
  const scenario = M.buildScenario(model);
  setStatus('保存中…');
  try {
    const r = await fetch('/api/scenario', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(scenario) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    setStatus(`✓ 已保存 ${d.id}${d.new?'(新)':''} 并重建游戏数据`);
    reloadScenarioList();
  } catch(e) { setStatus('保存失败：' + e.message, true); }
}
function setStatus(s, bad) { const el = $('status'); el.textContent = s; el.style.color = bad ? 'var(--bad)' : 'var(--muted)'; }
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(model)); } catch(e){} }

// ── model edits ─────────────────────────────────────────
function resizeModel(rows, cols) {
  const nt = [], nf = [];
  for (let r=0;r<rows;r++){ nt[r]=[]; nf[r]=[]; for(let c=0;c<cols;c++){ nt[r][c]=model.terrain[r]?.[c]??'outdoor'; nf[r][c]=model.feature[r]?.[c]??null; } }
  model.rows=rows; model.cols=cols; model.terrain=nt; model.feature=nf;
}
function toggle(arr, key) { const i = arr.indexOf(key); if (i>=0) arr.splice(i,1); else arr.push(key); }

// ── refresh panels ──────────────────────────────────────
function refreshAll() {
  $('m-id').value=model.meta.id; $('m-tzh').value=model.meta.title_zh; $('m-ten').value=model.meta.title_en;
  $('m-ch').value=model.meta.chapter_zh; $('m-diff').value=model.meta.difficulty;
  $('m-pages').value=(model.meta.pages_in_book||[]).join(','); $('m-img').value=model.meta.page_image||'';
  $('grows').value=model.rows; $('gcols').value=model.cols;
  $('r-hall').checked=model.rules.hallway_required; $('r-fd').value=model.rules.front_door.mode; $('r-fdw').value=model.rules.front_door.width||1;
  syncToolButtons(); renderRooms(); renderBonuses(); refreshFdInfo(); refreshValidation();
}
function renderRooms() {
  const box = $('rooms'); box.innerHTML='';
  model.rooms.forEach((room, i) => {
    const div = document.createElement('div'); div.className='listitem';
    div.innerHTML = `<div class="hd"><b>房间</b><button class="danger" data-x>✕</button></div>`;
    const mk = (label, val, on, ph='') => { const r=document.createElement('div'); r.className='row'; r.innerHTML=`<label class="k">${label}</label>`; const inp=document.createElement('input'); inp.type='text'; inp.value=val; inp.placeholder=ph; inp.oninput=()=>{on(inp.value);persist();refreshValidation();}; r.appendChild(inp); return r; };
    const slotRow=document.createElement('div'); slotRow.className='row'; slotRow.innerHTML='<label class="k">slot</label>';
    const ssel=document.createElement('select'); ['I','II','III','IV','V'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;ssel.appendChild(o);}); ssel.value=room.slot; ssel.onchange=()=>{room.slot=ssel.value;persist();refreshValidation();}; slotRow.appendChild(ssel);
    div.appendChild(slotRow);
    div.appendChild(mk('中文名', room.name_zh, v=>room.name_zh=v));
    div.appendChild(mk('英文名', room.name_en, v=>room.name_en=v));
    // furniture picker (unified named library)
    const pickRow=document.createElement('div'); pickRow.className='row';
    pickRow.innerHTML='<label class="k">家具</label>';
    const fsel=document.createElement('select'); fsel.style.flex='1';
    const groups={custom:[],card:[]}; for(const f of library)(groups[f.source]||groups.card).push(f.name);
    for(const [g,label] of [['custom','自定义'],['card','卡牌']]){ if(!groups[g].length)continue; const og=document.createElement('optgroup'); og.label=label; for(const nm of groups[g]){const o=document.createElement('option');o.value=nm;o.textContent=nm;og.appendChild(o);} fsel.appendChild(og); }
    pickRow.appendChild(fsel);
    const addb=document.createElement('button'); addb.textContent='添加'; addb.style.flex='none';
    addb.onclick=()=>{ if(fsel.value){ (room.furniture=room.furniture||[]).push(fsel.value); persist(); renderRooms(); refreshValidation(); } };
    pickRow.appendChild(addb); div.appendChild(pickRow);
    // live preview of the currently-selected option (so you can match name→image)
    const prev=document.createElement('div'); prev.style.cssText='display:flex;justify-content:center;align-items:center;min-height:70px;background:#15181c;border-radius:5px;margin:4px 0;padding:4px;';
    const showPrev=()=>{ prev.innerHTML=''; if(fsel.value) prev.appendChild(furnitureThumb(fsel.value, 76)); };
    fsel.onchange=showPrev; showPrev();
    div.appendChild(prev);
    // chosen furniture list (with thumbnails)
    (room.furniture||[]).forEach((nm, fi)=>{
      const fr=document.createElement('div'); fr.className='row'; fr.style.gap='5px';
      const th=furnitureThumb(nm, 30); th.style.flex='none'; fr.appendChild(th);
      const sp=document.createElement('span'); sp.style.flex='1'; sp.style.fontSize='12px'; sp.textContent=nm;
      if(!validNames.has(nm)){ sp.style.color='var(--bad)'; sp.title='不在家具库中'; }
      fr.appendChild(sp);
      const x=document.createElement('button'); x.className='danger'; x.textContent='✕'; x.style.padding='2px 6px'; x.style.flex='none';
      x.onclick=()=>{ room.furniture.splice(fi,1); persist(); renderRooms(); refreshValidation(); };
      fr.appendChild(x); div.appendChild(fr);
    });
    div.querySelector('[data-x]').onclick=()=>{ model.rooms.splice(i,1); persist(); renderRooms(); refreshValidation(); };
    box.appendChild(div);
  });
}
function renderBonuses() {
  const box = $('bonuses'); box.innerHTML='';
  model.bonus_points.forEach((b, i) => {
    const div = document.createElement('div'); div.className='listitem';
    div.innerHTML = `<div class="hd"><b>奖励 +<span></span></b><button class="danger" data-x>✕</button></div>`;
    const mk=(label,val,on,ph='')=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<label class="k">${label}</label>`;const inp=document.createElement('input');inp.type='text';inp.value=val;inp.placeholder=ph;inp.oninput=()=>{on(inp.value);persist();refreshValidation();};r.appendChild(inp);return r;};
    div.appendChild(mk('中文', b.text_zh, v=>b.text_zh=v));
    div.appendChild(mk('英文', b.text_en, v=>b.text_en=v));
    const pr=document.createElement('div');pr.className='row';pr.innerHTML='<label class="k">分值</label>';const pin=document.createElement('input');pin.type='number';pin.value=b.points;pin.oninput=()=>{b.points=parseInt(pin.value,10)||0;persist();div.querySelector('.hd span').textContent=b.points;};pr.appendChild(pin);div.appendChild(pr);
    div.querySelector('.hd span').textContent=b.points;
    const cr=document.createElement('div');cr.innerHTML='<div class="mini">condition (JSON，可留空):</div>';const ta=document.createElement('textarea');ta.value=b.condition?JSON.stringify(b.condition):'';ta.placeholder='{"all_installed_in_room":{...}}';
    ta.oninput=()=>{ const t=ta.value.trim(); if(!t){b.condition=undefined;ta.style.borderColor='';} else {try{b.condition=JSON.parse(t);ta.style.borderColor='var(--good)';}catch(e){ta.style.borderColor='var(--bad)';}} persist(); refreshValidation(); };
    cr.appendChild(ta);div.appendChild(cr);
    div.querySelector('[data-x]').onclick=()=>{ model.bonus_points.splice(i,1); persist(); renderBonuses(); refreshValidation(); };
    box.appendChild(div);
  });
}
function refreshValidation() {
  const issues = M.validate(model, validNames);
  const box = $('issues'); box.innerHTML='';
  if (!issues.length) { box.innerHTML='<div class="none">✓ 无问题</div>'; return; }
  for (const s of issues) { const d=document.createElement('div'); d.textContent='• '+s; box.appendChild(d); }
}

// ── canvas ──────────────────────────────────────────────
function resize(){ cv.width=stage.clientWidth; cv.height=stage.clientHeight; render(); }
window.addEventListener('resize', resize);
function fit(){ const s=Math.min(cv.width/(model.cols*BASECELL), cv.height/(model.rows*BASECELL))*0.9; scale=Math.max(0.1,s); offX=(cv.width-model.cols*BASECELL*scale)/2; offY=(cv.height-model.rows*BASECELL*scale)/2; }
const w2sX=x=>x*BASECELL*scale+offX, w2sY=y=>y*BASECELL*scale+offY;
const s2wX=x=>(x-offX)/(BASECELL*scale), s2wY=y=>(y-offY)/(BASECELL*scale);

function render() {
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const cell=BASECELL*scale;
  // terrain
  for (let r=0;r<model.rows;r++) for (let c=0;c<model.cols;c++) {
    ctx.fillStyle=TERRAIN_COLOR[model.terrain[r][c]]||'#000';
    ctx.fillRect(w2sX(c),w2sY(r),cell,cell);
    const f=model.feature[r][c];
    if (f){ ctx.fillStyle='#ffd27f'; ctx.font=`${Math.max(8,cell*0.3)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(f[0].toUpperCase(), w2sX(c)+cell/2, w2sY(r)+cell/2); }
  }
  // grid
  ctx.strokeStyle='rgba(160,180,220,.25)'; ctx.lineWidth=1; ctx.beginPath();
  for (let c=0;c<=model.cols;c++){const x=Math.round(w2sX(c))+.5;ctx.moveTo(x,w2sY(0));ctx.lineTo(x,w2sY(model.rows));}
  for (let r=0;r<=model.rows;r++){const y=Math.round(w2sY(r))+.5;ctx.moveTo(w2sX(0),y);ctx.lineTo(w2sX(model.cols),y);}
  ctx.stroke();
  // front-door forced cells
  if (model.rules.front_door.mode==='forced_cells') {
    ctx.fillStyle='rgba(255,182,72,.30)';
    for (const [r,c] of model.rules.front_door.forced_cells) ctx.fillRect(w2sX(c),w2sY(r),cell,cell);
  }
  // edges
  drawEdges(model.walls, '#e6e9ee', 4);
  drawEdges(model.windows, '#7fd0ff', 3, true);
  drawEdges(model.doors, '#57c98b', 5);
  // markers
  for (const mk of model.markers) {
    const [r,c]=mk.cell; const x=w2sX(c)+cell/2, y=w2sY(r)+cell/2;
    ctx.fillStyle='#ff8af0'; ctx.beginPath(); ctx.arc(x,y,Math.max(3,cell*0.18),0,7); ctx.fill();
    if (cell>26){ ctx.fillStyle='#fff'; ctx.font=`${Math.max(8,cell*0.22)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(mk.id, x, w2sY(r)+2); }
  }
}
function drawEdges(keys, color, lw, dashed) {
  const cell=BASECELL*scale; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.setLineDash(dashed?[5,4]:[]);
  ctx.beginPath();
  for (const k of keys) {
    const [t,rs,cs]=k.split(':'); const r=+rs,c=+cs;
    if (t==='h'){ ctx.moveTo(w2sX(c),w2sY(r)); ctx.lineTo(w2sX(c+1),w2sY(r)); }
    else { ctx.moveTo(w2sX(c),w2sY(r)); ctx.lineTo(w2sX(c),w2sY(r+1)); }
  }
  ctx.stroke(); ctx.setLineDash([]);
}

// ── canvas interaction ──────────────────────────────────
function cellAt(ev){ const rc=cv.getBoundingClientRect(); const c=Math.floor(s2wX(ev.clientX-rc.left)), r=Math.floor(s2wY(ev.clientY-rc.top)); if(c<0||r<0||c>=model.cols||r>=model.rows)return null; return {r,c}; }
function edgeAt(ev){ // nearest grid edge
  const rc=cv.getBoundingClientRect(); const wx=s2wX(ev.clientX-rc.left), wy=s2wY(ev.clientY-rc.top);
  const col=Math.round(wx), row=Math.round(wy);
  const dV=Math.abs(wx-col), dH=Math.abs(wy-row);
  if (dV<=dH){ const r=Math.floor(wy); if(col<0||col>model.cols||r<0||r>=model.rows)return null; return `v:${r}:${col}`; }
  const c=Math.floor(wx); if(row<0||row>model.rows||c<0||c>=model.cols)return null; return `h:${row}:${c}`;
}
let painting=false;
function applyPaint(ev, erase){
  if (tool==='terrain'||tool==='feature'){
    const cl=cellAt(ev); if(!cl)return;
    if (tool==='terrain') model.terrain[cl.r][cl.c]= erase?'outdoor':terrainValue;
    else model.feature[cl.r][cl.c]= erase?null:($('feature-sel').value||null);
    render(); return;
  }
  if (tool==='door'||tool==='window'||tool==='wall'){
    const k=edgeAt(ev); if(!k)return;
    const arr = tool==='door'?model.doors : tool==='window'?model.windows : model.walls;
    const i=arr.indexOf(k); if(erase){ if(i>=0)arr.splice(i,1);} else if(i<0)arr.push(k); else if(!painting)arr.splice(i,1);
    render(); return;
  }
  if (tool==='frontcell'){
    const cl=cellAt(ev); if(!cl)return; const fc=model.rules.front_door.forced_cells;
    const i=fc.findIndex(([r,c])=>r===cl.r&&c===cl.c);
    if(erase){if(i>=0)fc.splice(i,1);} else if(i<0)fc.push([cl.r,cl.c]); else if(!painting)fc.splice(i,1);
    refreshFdInfo(); render(); return;
  }
  if (tool==='marker' && !erase){
    const cl=cellAt(ev); if(!cl)return; const id=prompt('marker id（供奖励 covers_marker 引用）'); if(!id)return;
    model.markers=model.markers.filter(m=>!(m.cell[0]===cl.r&&m.cell[1]===cl.c)); model.markers.push({cell:[cl.r,cl.c],id});
    render(); return;
  }
  if (tool==='marker' && erase){ const cl=cellAt(ev); if(!cl)return; model.markers=model.markers.filter(m=>!(m.cell[0]===cl.r&&m.cell[1]===cl.c)); render(); }
}
cv.addEventListener('mousedown', ev=>{
  if (ev.button===1||spaceDown){ panning=true; panStart={x:ev.clientX,y:ev.clientY,ox:offX,oy:offY}; cv.style.cursor='grabbing'; ev.preventDefault(); return; }
  if (ev.button===0){ painting=true; applyPaint(ev,false); persist(); refreshValidation(); }
});
cv.addEventListener('contextmenu', ev=>{ ev.preventDefault(); const cl=cellAt(ev); if(cl){ applyPaint(ev,true); persist(); refreshValidation(); } });
cv.addEventListener('mousemove', ev=>{
  if (panning){ offX=panStart.ox+(ev.clientX-panStart.x); offY=panStart.oy+(ev.clientY-panStart.y); render(); return; }
  if (painting && (tool==='terrain'||tool==='feature')) applyPaint(ev,false);
});
window.addEventListener('mouseup', ()=>{ if(painting){persist();refreshValidation();} painting=false; panning=false; cv.style.cursor=spaceDown?'grab':'crosshair'; });
cv.addEventListener('wheel', ev=>{ ev.preventDefault(); const rc=cv.getBoundingClientRect(),mx=ev.clientX-rc.left,my=ev.clientY-rc.top; const wx=s2wX(mx),wy=s2wY(my),f=ev.deltaY<0?1.15:1/1.15; scale=Math.max(0.1,Math.min(20,scale*f)); offX=mx-wx*BASECELL*scale; offY=my-wy*BASECELL*scale; render(); },{passive:false});
window.addEventListener('keydown', ev=>{ if(ev.code==='Space'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){ spaceDown=true; cv.style.cursor='grab'; ev.preventDefault(); } });
window.addEventListener('keyup', ev=>{ if(ev.code==='Space'){ spaceDown=false; if(!panning)cv.style.cursor='crosshair'; } });

boot();
</script>
